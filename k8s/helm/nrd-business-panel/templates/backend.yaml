apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: {{ include "adminpanel.namespace" . }}
  labels: {{ include "adminpanel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.backend.storageClassName }}
  storageClassName: {{ .Values.backend.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ include "adminpanel.namespace" . }}
  labels: {{ include "adminpanel.labels" . | nindent 4 }}
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "adminpanel.namespace" . }}
  labels: {{ include "adminpanel.labels" . | nindent 4 }}
spec:
  # ВАЖНО: replicaCount > 1 небезопасен без доработки приложения — см.
  # values.yaml (backend.replicaCount) и README.md, раздел "Масштабирование
  # backend". Чарт это не блокирует технически (значение параметризовано), но
  # сознательно не предлагает готового решения проблемы онлайн-статуса и
  # записи файлов скриптов — это изменение кода Java, не манифестов.
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: {{ if eq (.Values.backend.replicaCount | int) 1 }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          # НЕ выставляем securityContext.runAsNonRoot здесь: entrypoint
          # контейнера (docker-entrypoint.sh) стартует от root на долю
          # секунды, чтобы поправить владельца тома /app/data, и сам передаёт
          # управление java от имени appuser (su -p). Принудительный non-root
          # на уровне пода сломает этот механизм. Остальные ограничения —
          # ниже — безопасны и не конфликтуют с ним.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: adminpanel-backend-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: POSTGRES_PASSWORD
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: APP_JWT_SECRET
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          resources: {{ toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: backend-data
---
{{- if .Values.backend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: {{ include "adminpanel.namespace" . }}
spec:
  maxUnavailable: {{ .Values.backend.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app: backend
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
# backend принимает трафик от Ingress-контроллера: отдельного пода web больше
# нет, backend отдаёт и API, и фронтенд, поэтому внешние запросы приходят прямо
# сюда. Health-пробы kubelet идут напрямую в под и NetworkPolicy их не
# затрагивает.
#
# Источник указан по пространству имён Ingress-контроллера — ЗАМЕНИТЕ метку на
# ту, что реально стоит на namespace вашего контроллера (у ingress-nginx это
# обычно ingress-nginx). Если оставить правило как есть и метка не совпадёт,
# панель окажется недоступна снаружи.
#
# Исходящий трафик (egress) не ограничиваем: скрипты могут обращаться к внешним
# API, и жёсткое правило сломало бы их выполнение непредсказуемым образом —
# сузьте под ваши реальные нужды.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: {{ include "adminpanel.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: 8080
{{- end }}
