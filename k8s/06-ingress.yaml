# Внешний доступ к панели. Рассчитано на ingress-nginx (ingressClassName: nginx) —
# если в кластере другой ingress-контроллер, поправьте ingressClassName и
# аннотации под него.
#
# ЗАМЕНИТЕ host на реальный домен панели.
#
# TLS терминируется на Ingress (нужен реальный сертификат корпоративного CA в
# Secret adminpanel-tls, например через cert-manager или руками:
# kubectl create secret tls adminpanel-tls --cert=... --key=... -n nrd-business-panel),
# а до пода трафик идёт простым HTTP на порт 8080.
#
# Отдельного пода с nginx больше нет: фронтенд и API отдаёт один сервис backend,
# поэтому и правило здесь одно — весь трафик на backend:8080.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminpanel
  namespace: nrd-business-panel
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m" # см. spring.servlet.multipart.max-file-size
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nrd-business-panel.dev002.local # ЗАМЕНИТЕ на реальный домен
      secretName: adminpanel-tls
  rules:
    - host: nrd-business-panel.dev002.local # ЗАМЕНИТЕ на реальный домен
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
