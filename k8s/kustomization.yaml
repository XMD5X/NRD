# Не обязателен, но удобен: kubectl apply -k k8s/ применит все манифесты
# папки разом, в правильном порядке зависимостей kubectl определит сам.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nrd-business-panel
resources:
  - 00-namespace.yaml
  - 02-configmap-app.yaml
  - 03-postgres.yaml
  - 04-backend.yaml
  - 06-ingress.yaml
  # 01-secret.example.yaml сознательно НЕ включён сюда — секрет создаётся
  # отдельной командой kubectl create secret (см. комментарий в файле),
  # а не применяется как манифест из репозитория.
