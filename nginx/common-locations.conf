# Общие location-блоки для http (:80) и https (:443) server-блоков в nginx.conf —
# вынесены сюда через include, чтобы не дублировать один и тот же список правил.
root /usr/share/nginx/html;
index index.html;

# Security-заголовки (см. аудит безопасности — раньше не было ни одного из них).
# Ставим здесь (уровень server, а не location), чтобы действовали на все ответы,
# включая /index.html и статику.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
# style-src с 'unsafe-inline' — в коде фронтенда есть React-компоненты с inline
# style={{...}}; script-src намеренно БЕЗ unsafe-inline/unsafe-eval — это то,
# что реально защищает от XSS (инлайн-скрипт из внедрённого HTML не выполнится).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# React SPA — все не-API маршруты отдаём на index.html
location / {
    try_files $uri $uri/ /index.html;
}

# Ограничение частоты запросов на логин (зона объявлена в nginx.conf) — см.
# аудит безопасности: раньше подбор пароля ничем не был ограничен ни на уровне
# nginx, ни на уровне backend.
location = /api/auth/login {
    limit_req zone=login_limit burst=20 nodelay;
    proxy_pass http://backend:8080/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Проксирование API на backend (см. HLD, раздел 3.2 "Диаграмма компонентов")
location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
}

location /actuator/health {
    proxy_pass http://backend:8080/actuator/health;
}
