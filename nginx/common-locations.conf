# Общие location-блоки для http (:80) и https (:443) server-блоков в nginx.conf —
# вынесены сюда через include, чтобы не дублировать один и тот же список правил.
root /usr/share/nginx/html;
index index.html;

# React SPA — все не-API маршруты отдаём на index.html
location / {
    try_files $uri $uri/ /index.html;
}

# Проксирование API на backend (см. HLD, раздел 3.2 "Диаграмма компонентов")
location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
}

location /actuator/health {
    proxy_pass http://backend:8080/actuator/health;
}
