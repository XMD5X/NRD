# HTTP — оставлен рабочим (не редиректит на https), чтобы не сломать уже
# сохранённые ссылки/интеграции на http://localhost:18080. HTTPS — на :443
# (наружу пробрасывается на том же 443, см. docker-compose.yml), сертификат
# самоподписанный и генерируется автоматически при первом запуске
# контейнера, см. nginx/generate-cert.sh.

# Скрываем версию nginx в заголовке Server и на страницах ошибок — не критично
# само по себе, но не даёт атакующему бесплатно узнать точную версию ПО.
server_tokens off;

# Ограничение частоты запросов на /login (см. common-locations.conf) — грубая
# защита на сетевом уровне от быстрого автоматического перебора; точная защита
# (по конкретному логину, с понятным сообщением) — на backend, см. AuthService.
# ВАЖНО: изначально стояло 5r/m burst=3 — это оказалось слишком жёстко для
# реальной работы (несколько быстрых попыток входа подряд при отладке уже
# упирались в лимит), и nginx отвечает на превышение лимита СВОЕЙ страницей
# ошибки 503 без JSON-тела — фронтенд не может показать осмысленное сообщение
# и показывает общее "Ошибка входа", неотличимое от неверного пароля. Подняли
# лимит с большим запасом — это по-прежнему на порядки строже, чем было
# (без всякого ограничения), но не мешает обычной работе.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    include /etc/nginx/common-locations.conf;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — только на https-блоке (на голом http заголовок бессмысленен и
    # мог бы преждевременно форсировать https для тех, у кого сертификату ещё
    # не доверяют). max-age небольшой (1 день) — сертификат самоподписанный,
    # а не 2 года как обычно советуют, чтобы не "запереть" браузер на https,
    # если самоподписанный сертификат создаст проблемы на этом стенде.
    add_header Strict-Transport-Security "max-age=86400" always;

    include /etc/nginx/common-locations.conf;
}
