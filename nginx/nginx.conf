# HTTP — оставлен рабочим (не редиректит на https), чтобы не сломать уже
# сохранённые ссылки/интеграции на http://localhost:18080. HTTPS — на :443
# (наружу пробрасывается как 18443, см. docker-compose.yml), сертификат
# самоподписанный и генерируется автоматически при первом запуске
# контейнера, см. nginx/generate-cert.sh.
server {
    listen 80;
    server_name _;
    include /etc/nginx/common-locations.conf;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/common-locations.conf;
}
