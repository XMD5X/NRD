# Локальный запуск полного стенда: docker compose up --build
# Веб-панель будет доступна на http://localhost:18080 — там же, где и API:
# отдельного контейнера с nginx больше нет, фронтенд и API отдаёт один сервис
# backend (см. backend/src/main/java/.../config/WebConfig.java).
#
# HTTPS на стенде не поднимается: в корпоративном контуре TLS терминируется выше
# (Ingress/балансировщик), а самоподписанный сертификат на локальном стенде только
# мешал — браузер каждый раз показывал предупреждение.
#
# См. HLD.md раздел 7 "Инфраструктура и деплой" — в продакшене используется
# Windows Server, здесь Docker Compose применяется только как удобный способ
# поднять идентичный стек для локальной проверки MVP командой.
#
# name: фиксирует имя проекта явно — папка проекта содержит пробел и кириллицу,
# из-за чего Docker Compose не смог бы корректно вывести имя проекта по умолчанию.
name: adminpanel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adminpanel
      POSTGRES_USER: adminpanel
      # Берётся из .env (создаётся deploy.bat, в git не попадает — см. .env.example).
      # ВНИМАНИЕ: применяется только при первой инициализации пустого тома pgdata —
      # инструкция по безопасной смене пароля на уже развёрнутом стенде в .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpanel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу не пробрасываем — backend обращается к БД внутри docker-сети
    # по имени сервиса (postgres:5432). Если на хосте уже занят порт 5432
    # (локальный PostgreSQL или другой сервис), это больше не будет конфликтовать.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminpanel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: adminpanel-backend:latest
    build:
      # Контекст — корень проекта: в образ попадает и backend, и собранный
      # фронтенд из frontend/dist-prebuilt (см. backend/Dockerfile). Тот же
      # контекст использует сборка в GitLab CI через kaniko.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/adminpanel
      SPRING_DATASOURCE_USERNAME: adminpanel
      # Оба секрета — из .env (создаётся deploy.bat автоматически, в git не попадает).
      # Раньше значения были захардкожены прямо здесь и утекли в историю git — это была
      # критичная уязвимость: обладая доступом к репозиторию, можно было подделать JWT
      # администратора без единого запроса к серверу. См. .env.example.
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-adminpanel}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Секрет не задан — запустите deploy.bat, он создаст .env автоматически, либо скопируйте .env.example в .env и заполните APP_JWT_SECRET вручную}
    volumes:
      - backend_data:/app/data
    ports:
      # Единственный порт стенда: и веб-панель, и API. Раньше здесь был
      # "127.0.0.1:18081:8080" — отладочный доступ к API в обход nginx; теперь
      # обходить нечего, а привычный адрес стенда (18080) сохраняется.
      - "18080:8080"

volumes:
  pgdata:
  backend_data:
