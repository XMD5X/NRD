# Локальный запуск полного стенда: docker compose up --build
# Веб-панель будет доступна на http://localhost:18080 и https://localhost (nginx;
# HTTPS — на самоподписанном сертификате, браузер покажет предупреждение о безопасности,
# это ожидаемо для локального стенда — см. nginx/generate-cert.sh),
# backend API напрямую — на http://localhost:18081 (для отладки).
#
# См. HLD.md раздел 7 "Инфраструктура и деплой" — в продакшене используется
# Windows Server, здесь Docker Compose применяется только как удобный способ
# поднять идентичный стек для локальной проверки MVP командой.
#
# name: фиксирует имя проекта явно — папка проекта содержит пробел и кириллицу,
# из-за чего Docker Compose не смог бы корректно вывести имя проекта по умолчанию.
name: adminpanel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adminpanel
      POSTGRES_USER: adminpanel
      # Берётся из .env (создаётся deploy.bat, в git не попадает — см. .env.example).
      # ВНИМАНИЕ: применяется только при первой инициализации пустого тома pgdata —
      # инструкция по безопасной смене пароля на уже развёрнутом стенде в .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpanel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу не пробрасываем — backend обращается к БД внутри docker-сети
    # по имени сервиса (postgres:5432). Если на хосте уже занят порт 5432
    # (локальный PostgreSQL или другой сервис), это больше не будет конфликтовать.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminpanel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: adminpanel-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/adminpanel
      SPRING_DATASOURCE_USERNAME: adminpanel
      # Оба секрета — из .env (создаётся deploy.bat автоматически, в git не попадает).
      # Раньше значения были захардкожены прямо здесь и утекли в историю git — это была
      # критичная уязвимость: обладая доступом к репозиторию, можно было подделать JWT
      # администратора без единого запроса к серверу. См. .env.example.
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-adminpanel}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Секрет не задан — запустите deploy.bat, он создаст .env автоматически, либо скопируйте .env.example в .env и заполните APP_JWT_SECRET вручную}
    volumes:
      - backend_data:/app/data
      # Access-логи nginx — только на чтение: backend их только зипует и
      # отдаёт по кнопке "Access-логи nginx" (/admin/settings), сам не пишет.
      - nginx_logs:/app/nginx-logs:ro
    ports:
      # Только на localhost — этот порт открывает API напрямую (HTTP, без TLS,
      # в обход nginx) и предназначен исключительно для локальной отладки.
      # Раньше был "18081:8080" (слушал на всех интерфейсах) — c любой другой
      # машины в той же сети можно было достучаться до backend в открытом виде.
      - "127.0.0.1:18081:8080"

  web:
    image: adminpanel-web:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "18080:80"
      - "443:443"
    volumes:
      # Именованный volume для самоподписанного TLS-сертификата: генерируется один раз
      # при первом старте контейнера (см. nginx/generate-cert.sh) и переживает пересборки
      # образа (docker compose up --build), пока volume не удалён явно (docker compose down -v).
      # Чтобы использовать настоящий корпоративный сертификат вместо самоподписанного —
      # положите server.crt и server.key в этот volume вместо сгенерированных.
      - nginx_certs:/etc/nginx/certs
      # Access-логи nginx (по дням, см. nginx/nginx.conf) — тот же том
      # смонтирован в backend read-only, см. выше.
      - nginx_logs:/var/log/nginx

volumes:
  pgdata:
  backend_data:
  nginx_certs:
  nginx_logs:
